<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASET PESONA KAHURIPAN — Sistem Manajemen Aset & GIS Satelit</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Draw CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- SheetJS (XLSX) untuk Export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .leaflet-container {
            font-family: 'Inter', sans-serif;
            z-index: 10;
            background: #0f172a;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
        }
        .leaflet-tooltip-custom {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(59, 130, 246, 0.85); }
            50% { border-color: rgba(16, 185, 129, 0.95); }
        }
        .drawing-active-banner {
            animation: pulse-border 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- ==================== TOP NAVBAR ==================== -->
    <header class="bg-slate-900 text-white border-b border-slate-800 px-4 py-2.5 flex items-center justify-between gap-3 shrink-0 z-30 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-satellite text-white text-base"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-bold text-sm sm:text-base tracking-tight leading-none uppercase">ASET <span class="text-emerald-400">PESONA KAHURIPAN</span></h1>
                    <span class="hidden sm:inline-block text-[10px] font-semibold uppercase tracking-wider bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full border border-slate-700">GIS &amp; Inventaris</span>
                </div>
                <p class="text-[11px] text-slate-400 hidden md:block">Pemetaan Citra Satelit &amp; Realtime Database</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button type="button" onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span class="hidden lg:inline">Export Excel</span>
            </button>
        </div>
    </header>

    <!-- ==================== MAIN WORKSPACE ==================== -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
        <section id="panel-table" class="w-full lg:w-[390px] h-[40%] lg:h-full bg-white flex flex-col border-r border-slate-200 overflow-hidden">
            <div class="p-3 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700">Daftar Aset Realtime</span>
            </div>
            <div class="flex-1 overflow-auto p-3">
                <p class="text-xs text-slate-500">Sistem terhubung ke Firebase Realtime Database.</p>
            </div>
            <div class="bg-slate-50 border-t border-slate-200 px-3 py-2 text-[11px] text-emerald-600 font-medium">
                Firebase Realtime DB: Connected
            </div>
        </section>

        <section id="panel-map" class="relative w-full lg:flex-1 h-[60%] lg:h-full flex flex-col">
            <div id="map" class="w-full h-full bg-slate-900"></div>
        </section>
    </main>

    <!-- ==================== FIREBASE SDK & STABLE SYNC ==================== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
      // Konfigurasi Proyek Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyCL088TuE-hprEcxjpaACXsVY5cc5qVJfk",
        authDomain: "manajemen-data-aset.firebaseapp.com",
        databaseURL: "https://manajemen-data-aset-default-rtdb.firebaseio.com",
        projectId: "manajemen-data-aset",
        storageBucket: "manajemen-data-aset.firebasestorage.app",
        messagingSenderId: "564939840608",
        appId: "1:564939840608:web:809585d1e2a0cf0bf03705",
        measurementId: "G-ZHFSXWMTYY"
      };

      firebase.initializeApp(firebaseConfig);
      const dbRef = firebase.database().ref("peta_aset/data");

      let assets = [];
      let isRemoteUpdate = false; // Mencegah perulangan tak terbatas

      // Listener Aman (Tanpa Loop Freeze)
      dbRef.on("value", (snapshot) => {
        const val = snapshot.val();
        if (val) {
          isRemoteUpdate = true;
          assets = Object.values(val);
          isRemoteUpdate = false;
        }
      }, (error) => {
        console.error("Error membaca database:", error);
      });

      // Fungsi Simpan Aman
      function persist() {
        if (isRemoteUpdate) return;
        const dataObj = {};
        assets.forEach(a => { 
          if(a && a.id) dataObj[a.id] = a; 
        });
        dbRef.set(dataObj).catch(err => console.log("Gagal sinkron:", err));
      }
    </script>
</body>
</html>
